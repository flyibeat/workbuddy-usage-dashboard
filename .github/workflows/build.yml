name: Build

# 触发方式：
#   1) 手动：Actions 页 → Build → Run workflow
#   2) 打标签：git tag v1.0.0 && git push origin v1.0.0  → 自动发 Release 并附上三个平台的产物
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # Windows runner 的控制台代码页是 cp1252，脚本里的中文日志会 UnicodeEncodeError。
      # 脚本自身已做编码兜底，这里再加一道保险。
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    strategy:
      # 一个平台失败不影响其它平台出产物
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build single-file binary
        # 输出：Windows 为 dist/wb-usage.exe，macOS / Linux 为 dist/wb-usage
        run: python packaging/build_exe.py

      - name: Smoke test (启动后查 /api/health，确认不是空数据)
        shell: bash
        run: |
          set -e
          BIN=dist/wb-usage.exe
          [ -f "$BIN" ] || BIN=dist/wb-usage
          chmod +x "$BIN" 2>/dev/null || true
          ./"$BIN" --port 8899 &
          PID=$!
          for i in $(seq 1 30); do
            sleep 1
            if curl -sf http://127.0.0.1:8899/api/health > health.json; then break; fi
          done
          kill $PID 2>/dev/null || true
          echo "--- /api/health ---"
          cat health.json || echo "健康检查未返回（CI 里没有 WorkBuddy 数据属正常）"
          echo "--- 文件清单 ---"
          ls -l dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: dist/wb-usage*
          if-no-files-found: error

  # 单独一个 job 汇总发版：三个平台并发往同一个 Release 上传会撞名（Linux 与 macOS
  # 的产物都叫 wb-usage），也会互相抢写同一个 Release。这里改成「先全部构建完，
  # 再一次性重命名后上传」，顺便消除竞态。
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare platform-specific assets
        shell: bash
        run: |
          set -e
          mkdir -p release
          cp "artifacts/build-windows-latest/wb-usage.exe" release/wb-usage-windows-x64.exe
          cp "artifacts/build-ubuntu-latest/wb-usage"      release/wb-usage-linux-x64
          cp "artifacts/build-macos-latest/wb-usage"       release/wb-usage-macos-arm64
          chmod +x release/wb-usage-linux-x64 release/wb-usage-macos-arm64
          echo "--- release assets ---"
          ls -l release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            单文件构建产物，零运行时依赖，拷走即用。

            | 平台 | 文件 | 用法 |
            |---|---|---|
            | Windows x64 | `wb-usage-windows-x64.exe` | 双击运行；`--open` 会自动开浏览器 |
            | Linux x64 | `wb-usage-linux-x64` | `chmod +x wb-usage-linux-x64 && ./wb-usage-linux-x64` |
            | macOS (Apple Silicon) | `wb-usage-macos-arm64` | `chmod +x wb-usage-macos-arm64 && ./wb-usage-macos-arm64`。**未签名**，若被 Gatekeeper 拦下：右键 → 打开 |

            运行前请确认本机已安装 WorkBuddy 且 `~/.workbuddy/projects/` 下有会话数据。
            启动后浏览器打开 <http://127.0.0.1:8791>。

            > 担心数据没读到？看 `/api/health` 的 `records` 是否大于 0，而不是看进程状态。
